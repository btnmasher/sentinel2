version: "3"
silent: true

vars:
  DOCKER_IMAGE: "sentinel2"
  BUN_TMPDIR_DEFAULT: "{{.TASKFILE_DIR}}/.tmp/bun"
  BUN_INSTALL_DEFAULT: "{{.TASKFILE_DIR}}/.tmp/bun-install"
  GOLANGCI_LINT_CACHE_DEFAULT: "{{.TASKFILE_DIR}}/.tmp/golangci-lint-cache"
  GO_BUILD_CACHE_DEFAULT: "{{.TASKFILE_DIR}}/.tmp/go-build-cache"
  TASKUTIL_BIN: '{{.TASKFILE_DIR}}/.tmp/bin/taskutil{{if eq OS "windows"}}.exe{{end}}'
  BACKEND_BIN: '{{.TASKFILE_DIR}}/bin/sentinel2-server{{if eq OS "windows"}}.exe{{end}}'

tasks:
  default:
    cmds:
      - task: build
    desc: Build frontend and backend.

  build:
    cmds:
      - echo "[build] starting full build (frontend, backend)"
      - task: build:frontend
      - task: build:backend
    desc: Build frontend and backend.

  clean:
    deps: [setup:taskutil]
    cmds:
      - "{{.TASKUTIL_BIN}} clean-root"
    desc: Remove local build artifacts and tool caches (preserves bin/.env and bin/pb_data).

  build:frontend:
    deps: [setup:deps:frontend]
    dir: frontend
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - echo "[build:frontend] building production bundle"
      - bun run build
    desc: Build frontend bundle.

  build:frontend:dev:
    deps: [setup:deps:frontend]
    dir: frontend
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - echo "[build:frontend:dev] building non-minified bundle"
      - bun run build -- --minify false
    desc: Build frontend bundle without minification.

  prepare:embed:
    cmds:
      - "{{.TASKUTIL_BIN}} prepare-embed"
    desc: Copy frontend dist to embed location.

  build:backend:
    deps: [prepare:embed]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    dir: backend
    env:
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - echo "[build:backend] building backend with embedded frontend"
      - mkdir -p "{{.TASKFILE_DIR}}/bin"
      - go build -tags embed_frontend -ldflags "-X main.BuildVersion={{.BUILD_VERSION}}" -o "{{.TASKFILE_DIR}}/bin/{{.OUTPUT_NAME | default "sentinel2-server"}}" ./main.go
    desc: Build backend binary with embedded frontend.

  build:backend:linux:
    deps: [prepare:embed]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    dir: backend
    env:
      GOOS: linux
      GOARCH: amd64
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - echo "[build:backend:linux] building linux backend with embedded frontend"
      - mkdir -p "{{.TASKFILE_DIR}}/bin"
      - go build -tags embed_frontend -ldflags "-X main.BuildVersion={{.BUILD_VERSION}}" -o "{{.TASKFILE_DIR}}/bin/sentinel2-server-{{.BUILD_VERSION}}-linux-amd64" ./main.go
    desc: Build backend binary for Linux (amd64).

  build:backend:darwin:
    deps: [prepare:embed]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    dir: backend
    env:
      GOOS: darwin
      GOARCH: arm64
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - echo "[build:backend:darwin] building macOS backend with embedded frontend"
      - mkdir -p "{{.TASKFILE_DIR}}/bin"
      - go build -tags embed_frontend -ldflags "-X main.BuildVersion={{.BUILD_VERSION}}" -o "{{.TASKFILE_DIR}}/bin/sentinel2-server-{{.BUILD_VERSION}}-darwin-arm64" ./main.go
    desc: Build backend binary for macOS (arm64).

  build:backend:windows:
    deps: [prepare:embed]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    dir: backend
    env:
      GOOS: windows
      GOARCH: amd64
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - echo "[build:backend:windows] building windows backend with embedded frontend"
      - mkdir -p "{{.TASKFILE_DIR}}/bin"
      - go build -tags embed_frontend -ldflags "-X main.BuildVersion={{.BUILD_VERSION}}" -o "{{.TASKFILE_DIR}}/bin/sentinel2-server-{{.BUILD_VERSION}}-windows-amd64.exe" ./main.go
    desc: Build backend binary for Windows (amd64).

  build:backend:skip-embed:
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    dir: backend
    env:
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - echo "[build:backend:skip-embed] building backend without embedded frontend"
      - mkdir -p "{{.TASKFILE_DIR}}/bin"
      - go build -ldflags "-X main.BuildVersion={{.BUILD_VERSION}}" -o "{{.TASKFILE_DIR}}/bin/{{.OUTPUT_NAME | default "sentinel2-server"}}" ./main.go
    desc: Build backend binary without embed tag.

  build:run:
    deps: [build]
    cmds:
      - task: run
    desc: Build everything and start the server.

  run:
    dir: bin
    cmds:
      - "{{.BACKEND_BIN}} serve"
    desc: Run the backend server (expects bin/sentinel2-server).

  migrate:run:
    dir: bin
    cmds:
      - "{{.BACKEND_BIN}} migrate"
    desc: Run database migrations (expects bin/sentinel2-server).

  build:migrate:
    deps: [build]
    cmds:
      - task: migrate:run
    desc: Build everything and run migrations.

  build:migrate:skip-embed:
    deps: [build:backend:skip-embed]
    cmds:
      - task: migrate:run
    desc: Build backend without embed assets and run migrations.

  build:migrate-run:
    deps: [build]
    cmds:
      - task: migrate:run
      - task: run
    desc: Build, run migrations, and start the server.

  lint:
    cmds:
      - task: lint:backend
      - task: lint:frontend
    desc: Run backend and frontend lint.

  lint:backend:
    cmds:
      - |
        set -euo pipefail
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint is not installed. See README for install steps." >&2
          exit 1
        fi
        if ! golangci-lint version 2>/dev/null | grep -qE 'version v?2\.'; then
          echo "golangci-lint v2 is required for this repo (.golangci.yml version: 2)." >&2
          echo "Install/upgrade with:" >&2
          echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest" >&2
          exit 1
        fi
        mkdir -p "{{.GOLANGCI_LINT_CACHE_DEFAULT}}" "{{.GO_BUILD_CACHE_DEFAULT}}"
        cd backend
        GOCACHE="{{.GO_BUILD_CACHE_DEFAULT}}" GOLANGCI_LINT_CACHE="{{.GOLANGCI_LINT_CACHE_DEFAULT}}" golangci-lint run ./...
    desc: Run backend lint.

  lint:backend:fix:
    cmds:
      - |
        set -euo pipefail
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint is not installed. See README for install steps." >&2
          exit 1
        fi
        if ! golangci-lint version 2>/dev/null | grep -qE 'version v?2\.'; then
          echo "golangci-lint v2 is required for this repo (.golangci.yml version: 2)." >&2
          echo "Install/upgrade with:" >&2
          echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest" >&2
          exit 1
        fi
        mkdir -p "{{.GOLANGCI_LINT_CACHE_DEFAULT}}" "{{.GO_BUILD_CACHE_DEFAULT}}"
        cd backend
        GOCACHE="{{.GO_BUILD_CACHE_DEFAULT}}" GOLANGCI_LINT_CACHE="{{.GOLANGCI_LINT_CACHE_DEFAULT}}" golangci-lint run --fix ./...
    desc: Run backend lint with auto-fix (local only).

  lint:frontend:
    deps: [setup:deps:frontend]
    dir: frontend
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - bun run lint
    desc: Run frontend lint.

  lint:frontend:fix:
    deps: [setup:deps:frontend]
    dir: frontend
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - bun run lint -- --fix
    desc: Run frontend lint with auto-fix (local only).

  docker:build:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - docker build --build-arg BUILD_VERSION={{.BUILD_VERSION}} -t {{.DOCKER_IMAGE}} .
    desc: Build Docker image with version tags.

  docker:up:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose up --build
    desc: Start production compose.

  docker:up:detach:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose up --build -d
    desc: Start production compose in detached mode.

  docker:logs:
    cmds:
      - docker compose logs -f
    desc: Tail production compose logs.

  docker:status:
    cmds:
      - docker compose ps
    desc: Show production compose status.

  docker:down:
    cmds:
      - docker compose down
    desc: Stop production compose.

  docker:restart:
    cmds:
      - task: docker:up:detach
    desc: Alias for docker:up:detach.

  docker:restart:migrate:
    cmds:
      - task: docker:up:migrate:detach
    desc: Alias for docker:up:migrate:detach.

  docker:up:migrate:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose run --rm sentinel2 /app/sentinel2-server migrate
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose up --build
    desc: Run migrations, then start production compose.

  docker:up:migrate:detach:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose run --rm sentinel2 /app/sentinel2-server migrate
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose up --build -d
    desc: Run migrations, then start production compose in detached mode.

  docker:tunnel:up:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up --build
    desc: Start production compose with Cloudflare Tunnel sidecar.

  docker:tunnel:up:detach:
    deps: [setup:taskutil]
    vars:
      BUILD_VERSION:
        sh: "{{.TASKUTIL_BIN}} version"
    cmds:
      - BUILD_VERSION={{.BUILD_VERSION}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up --build -d
    desc: Start production compose with Cloudflare Tunnel sidecar in detached mode.

  docker:tunnel:up:ghcr:
    requires:
      vars: [IMAGE]
    cmds:
      - SENTINEL2_IMAGE={{.IMAGE}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml pull sentinel2
      - SENTINEL2_IMAGE={{.IMAGE}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up --no-build
    desc: Start production+tunnel compose from registry image (IMAGE=ghcr.io/btnmasher/sentinel2:latest).

  docker:tunnel:up:ghcr:detach:
    requires:
      vars: [IMAGE]
    cmds:
      - SENTINEL2_IMAGE={{.IMAGE}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml pull sentinel2
      - SENTINEL2_IMAGE={{.IMAGE}} docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up --no-build -d
    desc: Start production+tunnel compose from registry image in detached mode (IMAGE=ghcr.io/btnmasher/sentinel2:latest).

  docker:tunnel:logs:
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.tunnel.yml logs -f
    desc: Tail production+tunnel compose logs.

  docker:tunnel:status:
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.tunnel.yml ps
    desc: Show production+tunnel compose status.

  docker:tunnel:down:
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.tunnel.yml down
    desc: Stop production+tunnel compose.

  docker:dev:up:
    cmds:
      - docker compose -f docker-compose.dev.yml up --build
    desc: Start dev compose (Vite + backend).

  docker:dev:up:migrate:
    cmds:
      - docker compose -f docker-compose.dev.yml run --rm backend-dev task build:migrate:skip-embed
      - docker compose -f docker-compose.dev.yml up --build
    desc: Run migrations, then start dev compose.

  docker:dev:down:
    cmds:
      - docker compose -f docker-compose.dev.yml down
    desc: Stop dev compose.

  docker:dev:logs:
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f
    desc: Tail dev compose logs.

  docker:dev:status:
    cmds:
      - docker compose -f docker-compose.dev.yml ps
    desc: Show dev compose status.

  dev:
    deps: [ensure-deps:bun, setup:taskutil]
    cmds:
      - task: build:backend:skip-embed
      - task: setup:deps:frontend
      - "{{.TASKUTIL_BIN}} dev"
    desc: Run Vite dev server + backend.

  dev:stop:
    cmds:
      - echo "dev runs in the foreground; stop with Ctrl+C."
    desc: Show how to stop dev.

  dev:logs:
    deps: [setup:taskutil]
    cmds:
      - "{{.TASKUTIL_BIN}} dev-logs-tail"
    desc: Tail Vite and backend dev logs.

  dev:logs:view:
    platforms: [linux, darwin]
    cmds:
      - |
        set -euo pipefail
        if ! command -v lnav >/dev/null 2>&1; then
          echo "lnav is not installed. Install it to use this viewer." >&2
          exit 1
        fi
        BASE_LOG_DIR="${LOG_DIR:-{{.TASKFILE_DIR}}/dev-logs}"
        if [ -f "$BASE_LOG_DIR/latest" ]; then
          LOG_DIR="$(cat "$BASE_LOG_DIR/latest")"
        else
          LOG_DIR="$BASE_LOG_DIR"
        fi
        if [ ! -d "$LOG_DIR" ]; then
          echo "No dev logs found at $LOG_DIR" >&2
          exit 1
        fi
        lnav "$LOG_DIR/vite.log" "$LOG_DIR/backend.log"
    desc: "Unix-only: open dev logs in lnav (use task dev:logs on Windows)."

  dev:logs:view:json:
    platforms: [linux, darwin]
    cmds:
      - |
        set -euo pipefail
        if ! command -v lnav >/dev/null 2>&1; then
          echo "lnav is not installed. Install it to use this viewer." >&2
          exit 1
        fi
        BASE_LOG_DIR="${LOG_DIR:-{{.TASKFILE_DIR}}/dev-logs}"
        if [ -f "$BASE_LOG_DIR/latest" ]; then
          LOG_DIR="$(cat "$BASE_LOG_DIR/latest")"
          JSON_FILE="$LOG_DIR/backend.jsonl"
        else
          JSON_FILE="${LOG_JSON_PATH:-$BASE_LOG_DIR/backend.jsonl}"
        fi
        if [ ! -f "$JSON_FILE" ]; then
          echo "No JSON log file found at $JSON_FILE" >&2
          exit 1
        fi
        lnav "$JSON_FILE"
    desc: "Unix-only: open JSON log file in lnav (use task dev:logs on Windows)."

  dev:logs:clean:
    deps: [setup:taskutil]
    cmds:
      - "{{.TASKUTIL_BIN}} dev-logs-clean"
    desc: Delete dev log folders older than KEEP_DAYS (default 7).

  dev:migrate:
    env:
      DEV_MIGRATIONS: "1"
    cmds:
      - task: dev
    desc: Run dev workflow with migrations first.

  dev:frontend:
    deps: [ensure-deps:bun]
    dir: frontend
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - task: setup
      - bun install --frozen-lockfile
      - bun run dev --host "{{.VITE_HOST | default "127.0.0.1"}}" --port "{{.VITE_PORT | default "5173"}}"
    desc: Run Vite dev server.

  dev:backend:
    env:
      DEV_PROXY: '{{.DEV_PROXY | default "127.0.0.1:5173"}}'
      LOG_PRETTY_PB: "1"
      LOG_JSON: "1"
      LOG_JSON_PB: "1"
      LOG_JSON_PATH: '{{.LOG_JSON_PATH | default (printf "%s/dev-logs/backend.jsonl" .TASKFILE_DIR) }}'
    dir: bin
    cmds:
      - task: setup
      - task: build:backend:skip-embed
      - "{{.BACKEND_BIN}} serve --dev"
    desc: Run backend with DEV_PROXY set.

  setup:
    deps: [ensure-deps:bun]
    cmds:
      - go version
      - task: setup:version:bun
      - task: setup:deps:frontend
      - task: setup:deps:backend
    desc: Verify Go/Bun and install frontend/backend dependencies.

  ensure-deps:
    deps: [ensure-deps:bun]
    desc: Ensure Bun build dependency is available.

  completion:install:
    platforms: [linux, darwin]
    cmds:
      - |
        set -euo pipefail
        SHELL_NAME="${SHELL:-}"
        SHELL_NAME="${SHELL_NAME##*/}"
        if [ -z "$SHELL_NAME" ] && command -v ps >/dev/null 2>&1; then
          SHELL_NAME="$(ps -p $$ -o comm= 2>/dev/null | awk -F/ '{print $NF}')"
        fi
        if [ -z "$SHELL_NAME" ]; then
          echo "Could not detect current shell. Run one of: task --completion bash|zsh|fish" >&2
          exit 1
        fi
        case "$SHELL_NAME" in
          bash)
            TARGET="$HOME/.local/share/bash-completion/completions/task"
            mkdir -p "$(dirname "$TARGET")"
            task --completion bash > "$TARGET"
            ;;
          zsh)
            TARGET="$HOME/.local/share/zsh/site-functions/_task"
            mkdir -p "$(dirname "$TARGET")"
            task --completion zsh > "$TARGET"
            ;;
          fish)
            TARGET="$HOME/.config/fish/completions/task.fish"
            mkdir -p "$(dirname "$TARGET")"
            task --completion fish > "$TARGET"
            ;;
          *)
            echo "Unsupported shell '$SHELL_NAME'. Run one of: task --completion bash|zsh|fish" >&2
            exit 1
            ;;
        esac
        echo "Installed task completion for $SHELL_NAME at $TARGET"
        echo "Restart your shell to load it."
    desc: "Unix-only: install task shell completion for the current shell."

  ensure-deps:bun:
    cmds:
      - mkdir -p "{{.BUN_TMPDIR_DEFAULT}}" "{{.BUN_INSTALL_DEFAULT}}"
    desc: Ensure Bun temp/cache directories exist.

  setup:version:bun:
    deps: [ensure-deps:bun]
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - bun --version
    desc: Print Bun version using project-local Bun cache dirs.

  setup:deps:frontend:
    deps: [ensure-deps:bun]
    dir: frontend
    method: checksum
    env:
      BUN_TMPDIR: "{{.BUN_TMPDIR_DEFAULT}}"
      BUN_INSTALL: "{{.BUN_INSTALL_DEFAULT}}"
    cmds:
      - bun install --frozen-lockfile
      - mkdir -p "{{.TASKFILE_DIR}}/.tmp/stamps"
      - cp bun.lock "{{.TASKFILE_DIR}}/.tmp/stamps/frontend-bun.lock"
    sources:
      - "{{.TASKFILE_DIR}}/frontend/package.json"
      - "{{.TASKFILE_DIR}}/frontend/bun.lock"
    generates:
      - "{{.TASKFILE_DIR}}/.tmp/stamps/frontend-bun.lock"
    desc: Install frontend dependencies.

  setup:deps:backend:
    dir: backend
    env:
      GOCACHE: "{{.GO_BUILD_CACHE_DEFAULT}}"
    cmds:
      - go mod download
    desc: Download backend Go module dependencies.

  setup:taskutil:
    cmds:
      - mkdir -p "{{.TASKFILE_DIR}}/.tmp/bin" "{{.GO_BUILD_CACHE_DEFAULT}}"
      - cd taskutil && GOCACHE="{{.GO_BUILD_CACHE_DEFAULT}}" go build -o "{{.TASKUTIL_BIN}}" .
    sources:
      - taskutil/**/*.go
      - taskutil/go.mod
      - taskutil/go.sum
    generates:
      - "{{.TASKUTIL_BIN}}"
    desc: Build taskutil helper binary.

  migrate:create:
    deps: [build:backend:skip-embed]
    requires:
      vars: [NAME]
    dir: backend
    cmds:
      - "{{.BACKEND_BIN}} migrate create {{.NAME}}"
    desc: Create a new PocketBase migration (NAME required).

  go:toolchain:update:
    dir: backend
    cmds:
      - go get go@latest
      - go version
    desc: Update module toolchain to latest Go (requires Go 1.21+).
