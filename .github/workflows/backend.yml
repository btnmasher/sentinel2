name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "Taskfile.yml"
      - ".golangci.yml"
      - ".golangci-lint-version"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Taskfile.yml"
      - ".golangci.yml"
      - ".golangci-lint-version"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Restore Go and lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
            ${{ github.workspace }}/.tmp/golangci-lint-cache
          key: ${{ runner.os }}-go-backend-lint-${{ hashFiles('backend/go.sum', '.golangci-lint-version') }}
          restore-keys: |
            ${{ runner.os }}-go-backend-lint-

      - name: Install golangci-lint
        run: |
          VERSION="$(cat .golangci-lint-version)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin "$VERSION"

      - name: Lint backend
        run: task lint:backend

  test:
    name: Backend go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Restore Go test cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
          key: ${{ runner.os }}-go-backend-test-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-backend-test-

      - name: Run backend tests
        working-directory: backend
        env:
          GOCACHE: ${{ github.workspace }}/.tmp/go-build-cache
        run: go test ./...
