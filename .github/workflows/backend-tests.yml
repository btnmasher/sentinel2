name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Restore Go test cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
          key: ${{ runner.os }}-go-backend-test-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-backend-test-

      - name: Run backend tests
        working-directory: backend
        env:
          GOCACHE: ${{ github.workspace }}/.tmp/go-build-cache
        run: go test ./...
