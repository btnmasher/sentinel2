name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Restore Go and lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
            ${{ github.workspace }}/.tmp/golangci-lint-cache
          key: ${{ runner.os }}-go-lint-${{ hashFiles('backend/go.sum', '.golangci-lint-version') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-

      - name: Install golangci-lint
        run: |
          VERSION="$(cat .golangci-lint-version)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin "$VERSION"

      - name: Lint backend
        run: task lint:backend

  uploader:
    name: Uploader lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Restore Go and lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
            ${{ github.workspace }}/.tmp/golangci-lint-cache
          key: ${{ runner.os }}-go-uploader-lint-${{ hashFiles('uploader/go.sum', '.golangci-lint-version') }}
          restore-keys: |
            ${{ runner.os }}-go-uploader-lint-

      - name: Install golangci-lint
        run: |
          VERSION="$(cat .golangci-lint-version)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin "$VERSION"

      - name: Lint uploader
        run: task -d uploader lint:go

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.8"

      - name: Restore Bun caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.tmp/bun
            ${{ github.workspace }}/.tmp/bun-install
            ${{ github.workspace }}/frontend/node_modules
          key: ${{ runner.os }}-bun-lint-${{ hashFiles('frontend/bun.lockb', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-lint-

      - name: Lint frontend
        run: task lint:frontend
