name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      taskutil: ${{ steps.filter.outputs.taskutil }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            taskutil:
              - 'taskutil/**'

  taskutil:
    name: Taskutil tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.taskutil == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Linux clipboard headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ${{ github.workspace }}/.tmp/go-build-cache
          key: ${{ runner.os }}-go-taskutil-test-${{ hashFiles('taskutil/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-taskutil-test-

      - name: Run taskutil tests
        run: go test ./...
        working-directory: taskutil
        env:
          GOCACHE: ${{ github.workspace }}/.tmp/go-build-cache

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.8"

      - name: Restore Bun caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.tmp/bun
            ${{ github.workspace }}/.tmp/bun-install
            ${{ github.workspace }}/frontend/node_modules
          key: ${{ runner.os }}-bun-lint-${{ hashFiles('frontend/bun.lock', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-lint-

      - name: Lint frontend
        run: task lint:frontend
