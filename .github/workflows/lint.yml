name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          working-directory: backend

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.8"

      - name: Lint frontend
        env:
          BUN_TMPDIR: ${{ github.workspace }}/.tmp/bun
          BUN_INSTALL: ${{ github.workspace }}/.tmp/bun-install
        run: |
          mkdir -p "$BUN_TMPDIR" "$BUN_INSTALL"
          cd frontend
          bun install --frozen-lockfile
          bun run lint
